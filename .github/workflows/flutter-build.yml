# أُنشئ بواسطة طاولة النماذج: يبني تطبيق Flutter (APK + ويب) بعد كل حفظ
name: Flutter Build

on:
  push:
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "assets/**"
      - ".github/workflows/flutter-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flutter-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          mkdir -p /tmp/keep
          cp -r lib pubspec.yaml /tmp/keep/
          [ -d assets ] && cp -r assets /tmp/keep/ || true
          [ -d test ] && cp -r test /tmp/keep/ || true
          NAME=$(grep -E '^name:' pubspec.yaml | awk '{print $2}' | tr -d '"\r')
          flutter create . --project-name "${NAME:-app}" --platforms=android,web --org com.roundtable
          rm -rf lib test
          cp -r /tmp/keep/lib . && cp /tmp/keep/pubspec.yaml .
          [ -d /tmp/keep/assets ] && cp -r /tmp/keep/assets . || true
          [ -d /tmp/keep/test ] && cp -r /tmp/keep/test . || true

      - name: App icon and name
        run: |
          if [ -d assets/launcher ]; then
            for d in assets/launcher/mipmap-*; do
              [ -d "$d" ] || continue
              mkdir -p "android/app/src/main/res/$(basename "$d")"
              cp "$d"/* "android/app/src/main/res/$(basename "$d")/"
            done
            [ -f assets/launcher/web/favicon.png ] && cp assets/launcher/web/favicon.png web/favicon.png || true
            [ -d assets/launcher/web/icons ] && cp assets/launcher/web/icons/*.png web/icons/ || true
          fi
          if [ -f assets/launcher/label.txt ]; then
            L=$(head -1 assets/launcher/label.txt | tr -d '\r')
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$L\"|" android/app/src/main/AndroidManifest.xml
            sed -i "s|<title>[^<]*</title>|<title>$L</title>|" web/index.html
          fi

      - name: Internet permission (release)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          grep -q 'android.intent.action.VIEW' "$M" || sed -i 's|<application|<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application|' "$M"
          grep -n 'INTERNET' "$M"

      - name: Release signing (fixed key)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No signing secrets: using the debug key"; exit 0; fi
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > android/app/upload.jks
          python3 - <<'PY'
          import os, pathlib
          pw = os.environ["KS_PASS"].strip(); alias = os.environ.get("KEY_ALIAS", "").strip() or "pentara"
          kts = pathlib.Path("android/app/build.gradle.kts"); gro = pathlib.Path("android/app/build.gradle")
          if kts.exists():
              s = kts.read_text()
              block = ('    signingConfigs {\n        create("release") {\n'
                       '            storeFile = file("upload.jks")\n'
                       f'            storePassword = "{pw}"\n            keyAlias = "{alias}"\n            keyPassword = "{pw}"\n'
                       '        }\n    }\n')
              s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              kts.write_text(s); print("signed (kts):", 'getByName("release")' in s)
          elif gro.exists():
              s = gro.read_text()
              block = ("    signingConfigs {\n        release {\n            storeFile file('upload.jks')\n"
                       f"            storePassword '{pw}'\n            keyAlias '{alias}'\n            keyPassword '{pw}'\n        }}\n    }}\n")
              s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
              s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              gro.write_text(s); print("signed (groovy):", "signingConfigs.release" in s)
          else:
              raise SystemExit("no android/app/build.gradle found")
          PY

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || { grep -E "error •" analyze.log | head -40 | sed 's/^ *//; s/^/::error::/'; exit 1; }

      - name: Build Android APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }} 2>&1 | tee apk.log || { grep -iE "error" apk.log | head -40 | sed 's/^/::error::/'; exit 1; }

      - name: Build Web
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=BUILD=${{ github.run_number }}
          # تحديث تلقائي: النسخة ورابط APK بجانب الموقع
          cp build/app/outputs/flutter-apk/app-release.apk build/web/app.apk
          OWNER="${{ github.repository_owner }}"; REPO="${{ github.event.repository.name }}"
          echo "{\"build\": ${{ github.run_number }}, \"apk\": \"https://${OWNER,,}.github.io/${REPO}/app.apk\"}" > build/web/version.json
          cat build/web/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
