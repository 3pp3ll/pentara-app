# أُنشئ بواسطة طاولة النماذج: يبني تطبيق Flutter (APK + ويب) بعد كل حفظ
name: Flutter Build

on:
  push:
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "assets/**"
      - ".github/workflows/flutter-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flutter-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          mkdir -p /tmp/keep
          cp -r lib pubspec.yaml /tmp/keep/
          [ -d assets ] && cp -r assets /tmp/keep/ || true
          [ -d test ] && cp -r test /tmp/keep/ || true
          NAME=$(grep -E '^name:' pubspec.yaml | awk '{print $2}' | tr -d '"\r')
          flutter create . --project-name "${NAME:-app}" --platforms=android,web --org com.roundtable
          rm -rf lib test
          cp -r /tmp/keep/lib . && cp /tmp/keep/pubspec.yaml .
          [ -d /tmp/keep/assets ] && cp -r /tmp/keep/assets . || true
          [ -d /tmp/keep/test ] && cp -r /tmp/keep/test . || true

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || { grep -E "error •" analyze.log | head -40 | sed 's/^ *//; s/^/::error::/'; exit 1; }

      - name: Build Android APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee apk.log || { grep -iE "error" apk.log | head -40 | sed 's/^/::error::/'; exit 1; }

      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
