name: pentara
description: "Pentara AI - live tables through the Pentara server."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# المرجع: Flutter SDK و flutter_localizations فقط،
# مع استثناء وحيد منصوص عليه: qr_flutter لرسم رمز QR في «حسابي».
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # ملفات الخطوط يضعها صاحب الطاولة في assets/fonts/ قبل التشغيل.
  # قسم fonts: وحده يضمّها إلى حزمة الأصول؛ لا يُكرَّر المجلد تحت assets:.
  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri-Medium.ttf
          weight: 500
        - asset: assets/fonts/ElMessiri-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
